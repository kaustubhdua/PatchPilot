<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">PatchPilot — Explainable pull request risk triage</title>
  <desc id="desc">A dark navy technical banner with violet diff marks, a central PatchPilot emblem, and evidence-first code review messaging.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d19"/><stop offset=".55" stop-color="#10172a"/><stop offset="1" stop-color="#17132c"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#8b5cf6" stop-opacity=".25"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#91a4ce" stroke-opacity=".10"/></pattern>
  </defs>
  <rect width="1280" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="22" fill="url(#grid)"/>
  <ellipse cx="1000" cy="150" rx="360" ry="270" fill="url(#glow)"/>
  <g fill="none" stroke="#a78bfa" stroke-opacity=".28">
    <path d="M825 62C980 2 1140 55 1172 162S1088 315 934 296 779 179 825 62Z"/>
    <path d="M861 77C981 31 1114 74 1137 166S1060 281 943 267 817 173 861 77Z"/>
    <path d="M900 96C989 64 1084 94 1102 168S1030 248 950 237 857 165 900 96Z"/>
  </g>
  <g transform="translate(84 88)">
    <rect width="68" height="68" rx="19" fill="url(#violet)"/>
    <path d="M21 49V18h14c9 0 14 5 14 13S44 44 35 44h-4v5zm10-13h4c4 0 6-2 6-5s-2-5-6-5h-4z" fill="#100d20"/>
    <text x="88" y="36" fill="#f1f3fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800" letter-spacing="-1.5">PatchPilot</text>
    <text x="89" y="61" fill="#a78bfa" font-family="monospace" font-size="11" letter-spacing="3">DIFF INTELLIGENCE / 01</text>
    <text x="0" y="126" fill="#f4f5fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" letter-spacing="-.8">Better code reviews.</text>
    <text x="0" y="165" fill="#c4b5fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" letter-spacing="-.8">Evidence, not guesswork.</text>
    <text x="1" y="201" fill="#9ca9c2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Explainable pull-request risk triage — without executing submitted code.</text>
  </g>
  <g transform="translate(835 100)">
    <rect width="348" height="174" rx="14" fill="#0b1120" stroke="#64708e" stroke-opacity=".48"/>
    <path d="M0 43H348" stroke="#64708e" stroke-opacity=".35"/>
    <circle cx="20" cy="22" r="4" fill="#fb7185"/><circle cx="34" cy="22" r="4" fill="#fbbf24"/><circle cx="48" cy="22" r="4" fill="#6ee7b7"/>
    <text x="67" y="26" fill="#7887a5" font-family="monospace" font-size="9" letter-spacing="1.5">CHANGESET.DIFF</text>
    <text x="20" y="71" fill="#fda4af" font-family="monospace" font-size="12">− unsafe_operation()</text>
    <text x="20" y="94" fill="#6ee7b7" font-family="monospace" font-size="12">+ validate_input()</text>
    <rect x="20" y="113" width="308" height="42" rx="7" fill="#a78bfa" fill-opacity=".09" stroke="#a78bfa" stroke-opacity=".38"/>
    <circle cx="38" cy="134" r="5" fill="#6ee7b7"/>
    <text x="52" y="138" fill="#dce2f1" font-family="monospace" font-size="10">RULE MATCH · EVIDENCE ATTACHED</text>
  </g>
  <text x="1190" y="329" text-anchor="end" fill="#77839e" font-family="monospace" font-size="10" letter-spacing="2">OPEN SOURCE · PYTHON · FASTAPI</text>
</svg>