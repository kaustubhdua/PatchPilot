name: PatchPilot pull-request triage
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base ref to compare (for example origin/main)"
        required: true
        default: "origin/main"
      head_ref:
        description: "Head ref to compare (for example HEAD)"
        required: true
        default: "HEAD"
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PATCHPILOT_BASE_REF: ${{ inputs.base_ref }}
      PATCHPILOT_HEAD_REF: ${{ inputs.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PatchPilot
        run: python -m pip install .
      - name: Generate diff
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "${PATCHPILOT_BASE_REF#origin/}" >/dev/null
          git check-ref-format "${PATCHPILOT_HEAD_REF#origin/}" >/dev/null
          git diff --no-ext-diff --unified=3 "$PATCHPILOT_BASE_REF" "$PATCHPILOT_HEAD_REF" > "$RUNNER_TEMP/patchpilot.diff"
      - name: Analyze diff
        shell: bash
        run: |
          set -euo pipefail
          patchpilot analyze --diff-file "$RUNNER_TEMP/patchpilot.diff" --title "GitHub Actions analysis" --json > "$RUNNER_TEMP/patchpilot-report.json"
          cat "$RUNNER_TEMP/patchpilot-report.json"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patchpilot-report
          path: ${{ runner.temp }}/patchpilot-report.json
          if-no-files-found: ignore
          retention-days: 7
