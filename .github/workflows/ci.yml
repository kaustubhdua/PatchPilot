name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Measure synthetic triage and test-suggestion relevance
        run: python scripts/benchmark_labeled.py
      - run: python -m compileall -q src tests
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --check website/app.js
