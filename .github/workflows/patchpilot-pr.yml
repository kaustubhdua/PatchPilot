name: PatchPilot pull-request analysis

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_number:
        description: "Pull request number to analyze"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: patchpilot-${{ github.event.pull_request.number || inputs.pull_number }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve trusted base revision
        id: revision
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "ref=$BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefOid --jq '.baseRefOid' > "$RUNNER_TEMP/base-ref"
            echo "ref=$(cat "$RUNNER_TEMP/base-ref")" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.revision.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install trusted PatchPilot version
        run: python -m pip install .

      - name: Fetch pull request diff
        id: diff
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/patchpilot.diff"
          if [[ ! -s "$RUNNER_TEMP/patchpilot.diff" ]]; then
            echo "No textual diff is available for analysis." >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Analyze diff
        if: steps.diff.outputs.available == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_number }}
        run: |
          set -euo pipefail
          patchpilot analyze --diff-file "$RUNNER_TEMP/patchpilot.diff" --title "Pull request #$PR_NUMBER" --json > "$RUNNER_TEMP/patchpilot-report.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["RUNNER_TEMP"], "patchpilot-report.json").read_text())
          summary = [
              "## PatchPilot risk triage",
              "",
              f"- **Risk level:** {report['risk_level']}",
              f"- **Heuristic score:** {report['risk_score']}/100",
              f"- **Files:** {report['files_changed']} · **Additions:** {report['additions']} · **Deletions:** {report['deletions']}",
              "",
              report["summary"],
              "",
          ]
          if report.get("analysis_warnings"):
              summary.extend(["### Analysis warnings", ""])
              summary.extend(f"- WARNING: {warning}" for warning in report["analysis_warnings"])
              summary.append("")
          summary.extend(["### Findings", ""])
          for finding in report["findings"]:
              summary.append(f"- **{finding['severity'].upper()} · {finding['rule_id']} — {finding['title']}**")
              summary.append(f"  {finding['detail']}")
              evidence = "; ".join(finding.get("evidence", [])[:3])
              if evidence:
                  summary.append(f"  Evidence: `{evidence}`")
              for location in finding.get("locations", [])[:5]:
                  summary.append(f"  Location: `{location}`")
          summary.extend(["", "### Suggested tests", ""])
          summary.extend(f"- {item}" for item in report["recommended_tests"])
          summary.extend(["", f"> {report['disclaimer']}", "", "> This report is heuristic triage, not a merge decision. The workflow checks out the base revision and does not execute PR code."])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(summary) + "\n")
          PY
