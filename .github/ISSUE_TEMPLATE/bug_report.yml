name: Bug report
description: Report a reproducible defect in PatchPilot
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please do not include secrets, private source code, or sensitive customer data."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the unexpected behavior.
      placeholder: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run ...\n2. Provide ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PatchPilot version or commit
      placeholder: "0.1.0 / commit SHA"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, CLI/API/Docker, and relevant workflow.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, secrets, private code, and personal data before sharing.
