[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "patchpilot"
version = "0.1.0"
description = "Explainable pull-request risk analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["fastapi>=0.115,<1.0", "pydantic>=2.8,<3.0", "uvicorn[standard]>=0.30,<1.0"]

[project.scripts]
patchpilot = "patchpilot.cli:main"

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.3,<9.0", "ruff>=0.6,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/patchpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
