[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "patchpilot"
version = "0.1.0"
description = "Explainable pull-request risk analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }


[project.scripts]
patchpilot = "patchpilot.cli:main"

[project.optional-dependencies]


[tool.hatch.build.targets.wheel]
packages = ["src/patchpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
